<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>AULIT42369 – Planning</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#070a10; --cyan:#00f5ff; --violet:#9b5cff; --magenta:#ff2d78;
    --white:#e8eaf6; --dim:#4a5568;
    --glow-c:0 0 8px #00f5ff,0 0 24px #00f5ff55;
    --glow-v:0 0 8px #9b5cff,0 0 24px #9b5cff55;
    --glow-m:0 0 8px #ff2d78,0 0 24px #ff2d7855;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);font-family:'Rajdhani',sans-serif;color:var(--white);}

  .screen{position:relative;width:1920px;height:1080px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;}

  /* grille de fond */
  .grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(0,245,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,245,255,.04) 1px,transparent 1px);background-size:64px 64px;}

  /* orbs scintillants */
  .orb{position:absolute;border-radius:50%;pointer-events:none;}
  .orb-c{width:55%;aspect-ratio:1;background:var(--cyan);top:-25%;right:-20%;filter:blur(200px);opacity:.2;animation:scintille 5s ease-in-out infinite;}
  .orb-v{width:40%;aspect-ratio:1;background:var(--violet);bottom:-20%;left:-10%;filter:blur(200px);opacity:.18;animation:scintille 5s ease-in-out infinite reverse;}
  @keyframes scintille{0%,100%{opacity:.12;filter:blur(220px);}50%{opacity:.28;filter:blur(180px);}}

  /* anneaux de pulse (même que starting) */
  .pulse-ring{position:absolute;width:700px;height:700px;border-radius:50%;border:1px solid var(--cyan);animation:pulseRing 3s ease-out infinite;box-shadow:inset 0 0 40px #00f5ff0a;opacity:.4;}
  .pulse-ring:nth-child(4){animation-delay:1s;}
  .pulse-ring:nth-child(5){animation-delay:2s;}
  @keyframes pulseRing{0%{transform:scale(.3);opacity:.6}100%{transform:scale(2);opacity:0}}

  /* scan line */
  .scan{position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(0,245,255,.6),transparent);animation:scanMove 5s linear infinite;z-index:1;}
  @keyframes scanMove{0%{top:-2px;opacity:0}5%{opacity:1}95%{opacity:1}100%{top:100%;opacity:0}}

  /* ── CONTENU ── */
  .content{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;gap:48px;}

  /* header */
  .header{text-align:center;}
  .eyebrow{font-size:.85rem;letter-spacing:.55em;text-transform:uppercase;color:var(--cyan);text-shadow:var(--glow-c);margin-bottom:14px;}
  .main-title{font-family:'Orbitron',sans-serif;font-size:3.8rem;font-weight:900;color:var(--white);line-height:1;}
  .main-title em{color:var(--cyan);font-style:normal;text-shadow:var(--glow-c);}

  /* ligne séparatrice */
  .sep{width:600px;height:1px;background:linear-gradient(90deg,transparent,var(--violet),transparent);box-shadow:var(--glow-v);}

  /* ── GRILLE PLANNING ── */
  .planning{display:flex;gap:18px;align-items:stretch;}

  /* ══════════════════════
     CARTE JOUR
     ✏️ Pour modifier : éditez les données dans le JS en bas
  ══════════════════════ */
  .card{
    position:relative;
    width:220px;
    background:linear-gradient(180deg,#0d1220,#080c18);
    border:1px solid #1a2540;
    overflow:hidden;
    display:flex;flex-direction:column;
    clip-path:polygon(10px 0%,calc(100% - 10px) 0%,100% 10px,100% 100%,0% 100%,0% 10px);
  }
  /* ligne du haut colorée */
  .card::before{
    content:'';position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,transparent,var(--card-color),transparent);
    box-shadow:0 0 8px var(--card-color);
    z-index:2;
  }
  /* coin bas droite */
  .card::after{
    content:'';position:absolute;bottom:0;right:0;
    width:14px;height:14px;
    border-bottom:1px solid var(--card-color);
    border-right:1px solid var(--card-color);
    opacity:.5;z-index:2;
  }

  /* header carte */
  .card-head{
    padding:16px 18px 12px;
    border-bottom:1px solid #1a2540;
    flex-shrink:0;
  }
  .card-day{
    font-family:'Orbitron',sans-serif;
    font-size:.75rem;font-weight:900;
    color:var(--white);letter-spacing:.1em;
    text-transform:uppercase;
  }
  .card-date{
    font-size:.58rem;letter-spacing:.2em;
    color:var(--card-color);
    text-shadow:0 0 8px var(--card-color);
    margin-top:3px;text-transform:uppercase;
  }

  /* body carte */
  .card-body{padding:14px 18px;display:flex;flex-direction:column;gap:10px;flex:1;}
  .card-row{display:flex;align-items:center;gap:10px;}
  .card-icon{font-size:.9rem;flex-shrink:0;width:20px;text-align:center;}
  .card-info{font-size:.68rem;color:#8892a8;line-height:1.4;}
  .card-info strong{color:var(--white);display:block;font-size:.72rem;letter-spacing:.05em;}

  /* badge OFF */
  .card.off{opacity:.45;}
  .card.off .card-body{align-items:center;justify-content:center;}
  .off-label{font-family:'Orbitron',sans-serif;font-size:.6rem;letter-spacing:.3em;color:var(--dim);text-transform:uppercase;}

  /* badge AUJOURD'HUI */
  .badge-today{
    display:inline-block;
    font-size:.42rem;letter-spacing:.2em;text-transform:uppercase;
    padding:3px 8px;margin-top:5px;
    background:var(--card-color);
    color:var(--bg);
    font-family:'Orbitron',sans-serif;font-weight:700;
    border-radius:1px;
  }

  /* barre de progression déco bas de carte */
  .card-prog{height:2px;background:#1a2540;margin:0 18px 14px;border-radius:2px;overflow:hidden;}
  .card-prog-fill{height:100%;background:linear-gradient(90deg,var(--violet),var(--card-color));box-shadow:0 0 6px var(--card-color);animation:fillAnim 3s ease-in-out infinite alternate;}
  @keyframes fillAnim{from{width:15%}to{width:92%}}

  /* bas de page */
  .bottom-name{position:absolute;bottom:5%;left:0;right:0;text-align:center;z-index:3;font-family:'Orbitron',sans-serif;font-size:.75rem;letter-spacing:.3em;color:var(--dim);}
</style>
</head>
<body>
<div class="screen">
  <div class="grid-bg"></div>
  <div class="orb orb-c"></div>
  <div class="orb orb-v"></div>
  <div class="pulse-ring"></div>
  <div class="pulse-ring"></div>
  <div class="pulse-ring"></div>
  <div class="scan"></div>

  <div class="content">
    <div class="header">
      <div class="eyebrow">// Programme de la semaine</div>
      <div class="main-title">PLANNING <em>STREAM</em></div>
    </div>

    <div class="sep"></div>

    <!-- ══ PLANNING — généré par JS ══ -->
    <div class="planning" id="planning"></div>
  </div>

  <div class="bottom-name">AULIT42369 &nbsp;·&nbsp; TWITCH.TV</div>
</div>

<script>
/* ════════════════════════════════════════════════════════
   ✏️  MODIFIE TON PLANNING ICI
   ────────────────────────────────────────────────────────
   Chaque objet = un jour de la semaine
   Champs :
     day    → nom du jour
     on     → true = stream prévu | false = pas de stream
     time   → horaire de début
     end    → horaire de fin
     game   → jeu prévu
     color  → couleur du cadre (hex ou var CSS)

   Tu peux ajouter / supprimer des jours librement.
════════════════════════════════════════════════════════ */
const PLANNING = [
  {
    day:   'Lundi',
    on:    false,
    time:  '',
    end:   '',
    game:  '',
    color: '#00f5ff'
  },
  {
    day:   'Mardi',
    on:    false,
    time:  '',
    end:   '',
    game:  '',
    color: '#4a5568'
  },
  {
    day:   'Mercredi',
    on:    true,
    time:  '16:30',
    end:   '00:00',
    game:  'A Déterminer',
    color: '#9b5cff'
  },
  {
    day:   'Jeudi',
    on:    true,
    time:  '16:30',
    end:   '00:00',
    game:  'A Déterminer',
    color: '#4a5568'
  },
  {
    day:   'Vendredi',
    on:    true,
    time:  '21:00',
    end:   '00:00',
    game:  'A Déterminer',
    color: '#00f5ff'
  },
  {
    day:   'Samedi',
    on:    true,
    time:  '14:00',
    end:   '00:00',
    game:  'A Déterminer',
    color: '#ff2d78'
  },
  {
    day:   'Dimanche',
    on:    true,
    time:  '14:00',
    end:   '00:00',
    game:  'A Déterminer',
    color: '#4a5568'
  }
];

/* ── Détection du jour actuel ── */
const JOURS = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const aujourdhui = JOURS[new Date().getDay()];

/* ── Génération des cartes ── */
const container = document.getElementById('planning');

PLANNING.forEach(item => {
  const isToday = item.day === aujourdhui;
  const card = document.createElement('div');
  card.className = 'card' + (item.on ? '' : ' off');
  card.style.setProperty('--card-color', item.color);

  if (item.on) {
    card.innerHTML = `
      <div class="card-head">
        <div class="card-day">${item.day}</div>
        <div class="card-date">${item.time} → ${item.end}</div>
        ${isToday ? '<span class="badge-today">● Aujourd\'hui</span>' : ''}
      </div>
      <div class="card-body">
        <div class="card-row">
          <div class="card-icon">🎮</div>
          <div class="card-info">
            <strong>${item.game}</strong>
            Jeu du jour
          </div>
        </div>
        <div class="card-row">
          <div class="card-icon">🕐</div>
          <div class="card-info">
            <strong>${item.time} – ${item.end}</strong>
            Heure FR (CET)
          </div>
        </div>
      </div>
      <div class="card-prog"><div class="card-prog-fill"></div></div>
    `;
  } else {
    card.innerHTML = `
      <div class="card-head">
        <div class="card-day">${item.day}</div>
        <div class="card-date">Pas de stream</div>
      </div>
      <div class="card-body">
        <div class="off-label">— Repos —</div>
      </div>
    `;
  }

  container.appendChild(card);
});
</script>
</body>
</html>
